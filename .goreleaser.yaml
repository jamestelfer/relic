# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: relic

# templ templates are generated into Go source before any build. The justfile
# normally runs this via `just generate`; GoReleaser builds with `go build`
# directly, so the codegen has to run here too or the build fails on missing
# renderer_templ.go symbols.
before:
  hooks:
    - go tool templ generate ./...

builds:
  - id: relic
    binary: relic
    main: ./cmd/relic
    flags:
      - "-trimpath"
    # Stamp the version into the renderer footer (the same variable the justfile
    # injects for local builds).
    ldflags: "-s -w -X github.com/jamestelfer/relic/internal/renderer.Version={{.Version}}"
    env:
      - CGO_ENABLED=0
      # encoding/json/v2 is enabled everywhere in this project (Go 1.26).
      - GOEXPERIMENT=jsonv2
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - repository:
      owner: jamestelfer
      name: homebrew-tap
      # The release workflow mints a contents:write token for the shared tap
      # (octo-sts) and exposes it here; GoReleaser writes the cask with it
      # rather than the repo-scoped GITHUB_TOKEN.
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    homepage: "https://github.com/jamestelfer/relic"
    description: "Convert Claude Code session logs into shareable, self-contained HTML."
    license: "Apache-2.0"
    # The release binaries are not notarized; strip the quarantine bit on macOS
    # so the cask runs without a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/relic"]
          end

# Changelog and release notes are owned by release-please, not GoReleaser.

# Note: artifacts are NOT signed by GoReleaser. Keyless build-provenance
# attestations are produced by the reusable release workflow, which reads the
# checksum file below (`checksums.txt`) as its subject list so every artifact is
# attested by digest. Keep the checksum name_template stable — the workflow
# references `dist/checksums.txt`.

release:
  prerelease: auto
  # release-please creates the GitHub Release as a draft and force-creates the
  # tag; GoReleaser fills that existing draft (without overwriting its notes) and
  # leaves it unpublished. The release workflow publishes it only after
  # attestation runs, so no artifact is downloadable before its provenance is
  # recorded.
  draft: true
  use_existing_draft: true
  mode: keep-existing
